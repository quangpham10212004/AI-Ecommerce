<style>
        body {
            background-color: #f8f9ff;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 102, 138, 0.1);
            box-shadow: 0 10px 40px rgba(0, 73, 101, 0.08);
            animation: float-entrance 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes float-entrance {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .gradient-border {
            border: 1px solid transparent;
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)) padding-box,
                        linear-gradient(to bottom right, rgba(0, 102, 138, 0.2), transparent) border-box;
        }

        /* SVG Background Animation */
        .bg-glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #f8f9ff;
        }

        .blob {
            position: absolute;
            width: 800px;
            height: 800px;
            fill: url(#aura-gradient);
            filter: blur(80px);
            opacity: 0.15;
            animation: move-blob 35s infinite alternate ease-in-out;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            fill: url(#aura-gradient-2);
            opacity: 0.12;
            animation: move-blob 25s infinite alternate-reverse ease-in-out;
            left: 30%;
            top: 20%;
        }

        @keyframes move-blob {
            0% { transform: translate(-10%, -10%) rotate(0deg) scale(1); }
            50% { transform: translate(20%, 30%) rotate(180deg) scale(1.1); }
            100% { transform: translate(40%, -20%) rotate(360deg) scale(1); }
        }

        .tab-active {
            background: rgba(0, 102, 138, 0.05);
            color: #00668a;
            border-bottom: 2px solid #00668a;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Interactive Elements */
        .input-glow-focus:focus-within {
            box-shadow: 0 4px 15px -5px rgba(0, 102, 138, 0.2);
            border-color: #38bdf8 !important;
        }

        .btn-pulse:hover {
            animation: btn-pulse 1.5s infinite;
        }

        @keyframes btn-pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 102, 138, 0.2); }
            70% { box-shadow: 0 0 0 15px rgba(0, 102, 138, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 102, 138, 0); }
        }

        .fade-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            .glass-card, .blob, .btn-pulse:hover, .fade-transition {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>

<h1 class="font-display-md text-display-md text-primary tracking-tight">Aura</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit tracking-widest uppercase" id="role-subtitle">Intelligent E-Commerce Hub</p>
</div>
<!-- Login Card -->
<div class="glass-card gradient-border rounded-xl p-stack-lg w-full">
<!-- Role Switcher -->
<div class="flex border-b border-outline-variant/30 mb-stack-lg">
<button class="flex-1 py-stack-md font-label-md text-label-md transition-all duration-300 tab-active" id="tab-Customer" onclick="switchRole('Customer')">
                CUSTOMER
            </button>
<button class="flex-1 py-stack-md font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all duration-300" id="tab-Staff" onclick="switchRole('Staff')">
                STAFF
            </button>
<button class="flex-1 py-stack-md font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all duration-300" id="tab-Admin" onclick="switchRole('Admin')">
                ADMIN
            </button>
</div>
<!-- Form Wrapper for Crossfade -->
<div class="fade-transition" id="form-container">
<form action="#" class="space-y-stack-md" onsubmit="return false;">
<div class="space-y-unit">
<label class="font-label-sm text-label-sm text-outline ml-1">IDENTITY IDENTIFIER</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline transition-colors duration-300">alternate_email</span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-3 pl-8 text-on-surface placeholder:text-outline/40 focus:ring-0 input-glow-focus transition-all font-body-md" placeholder="email@aura-digital.io" type="email"/>
</div>
</div>
<div class="space-y-unit">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-outline">ENCRYPTION KEY</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">FORGOT KEY?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline transition-colors duration-300">lock</span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-3 pl-8 text-on-surface placeholder:text-outline/40 focus:ring-0 input-glow-focus transition-all font-body-md" placeholder="••••••••" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center space-x-stack-sm pt-unit">
<input class="w-4 h-4 rounded border-outline-variant bg-transparent text-primary focus:ring-primary focus:ring-offset-background transition-all" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Persistent Session</label>
</div>
<button class="btn-pulse w-full mt-stack-lg py-4 rounded-lg bg-gradient-to-r from-primary to-primary-container text-white font-headline-md text-headline-md shadow-[0_4px_15px_rgba(0,102,138,0.2)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 group overflow-hidden">
<span class="relative z-10">Initiate Access</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform relative z-10">arrow_forward</span>
</button>
</form>
<!-- Footer Action -->
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant" id="role-footer">
                    New to the network? <a class="text-primary font-semibold hover:underline" href="#">Register Account</a>
</p>
</div>
</div>
</div>
<!-- Security Badge -->
<div class="mt-stack-lg flex justify-center items-center gap-stack-md opacity-60">
<div class="flex items-center gap-unit text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">Quantum Encrypted</span>
</div>
<div class="h-1 w-1 bg-outline-variant rounded-full"></div>
<div class="flex items-center gap-unit text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">bolt</span>
<span class="font-label-sm text-label-sm">Neural Auth</span>
</div>
</div>
</main>
<script>
    let isTransitioning = false;

    function switchRole(role) {
        if (isTransitioning) return;
        isTransitioning = true;

        const roles = ['Customer', 'Staff', 'Admin'];
        const subtitle = document.getElementById('role-subtitle');
        const footer = document.getElementById('role-footer');
        const formContainer = document.getElementById('form-container');
        
        // Start fade out
        formContainer.style.opacity = '0';
        formContainer.style.transform = 'translateY(10px)';

        setTimeout(() => {
            roles.forEach(r => {
                const tab = document.getElementById(`tab-${r}`);
                if (r === role) {
                    tab.classList.add('tab-active');
                    tab.classList.remove('text-on-surface-variant');
                } else {
                    tab.classList.remove('tab-active');
                    tab.classList.add('text-on-surface-variant');
                }
            });

            // Update content during transparency
            if (role === 'Customer') {
                subtitle.innerText = "Intelligent E-Commerce Hub";
                footer.innerHTML = 'New to the network? <a href="#" class="text-primary font-semibold hover:underline">Register Account</a>';
            } else if (role === 'Staff') {
                subtitle.innerText = "Internal Operations Portal";
                footer.innerHTML = 'Restricted Access. <a href="#" class="text-primary font-semibold hover:underline">Contact System Admin</a>';
            } else if (role === 'Admin') {
                subtitle.innerText = "Core System Infrastructure";
                footer.innerHTML = 'Authorization Required. <a href="#" class="text-primary font-semibold hover:underline">Request Elevated Clearance</a>';
            }

            // Start fade in
            formContainer.style.opacity = '1';
            formContainer.style.transform = 'translateY(0)';
            
            setTimeout(() => {
                isTransitioning = false;
            }, 400);
        }, 200);

        // Haptic-style card feedback
        const card = document.querySelector('.glass-card');
        card.style.transform = 'scale(0.99)';
        setTimeout(() => card.style.transform = 'scale(1)', 100);
    }

    // Interactive mouse parallax for header
    document.addEventListener('mousemove', (e) => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        
        const x = (e.clientX / window.innerWidth - 0.5) * 15;
        const y = (e.clientY / window.innerHeight - 0.5) * 15;
        
        const header = document.getElementById('header-area');
        header.style.transform = `translate(${x}px, ${y}px)`;
    });
</script>
</body></html>
